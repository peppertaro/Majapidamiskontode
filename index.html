<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Majapidamiskontode</title>
    <link rel="icon" href="./logo.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://accounts.google.com/gsi/client" defer"></script>
    <script src="./app.js" defer></script>
</head>
<body>
    <div id="toast" class="toast"></div>
    <header>
        <object id="logo-icon" data="./logo.svg" alt="Logo" type="image/svg+xml"></object>
        <div id="logo-text">
            <h1 id="logo-name"><span>Majapidamis</span><span>kontode</span></h1>
            <p>HOUSEHOLD LOG</p>
        </div>
    </header>
    <div class="search-container">
        <input type="text" id="cmd" placeholder="/" list="cmd-list" autocomplete="off" autofocus>
        <datalist id="cmd-list"><option value="Loading..." /></datalist>
    </div>
    <dialog id="dlg">
        <form id="dlg-container" method="dialog">
            <div id="dlg-content"></div>
            <button id="dlg-close" aria-label="close" value="cancel"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </form>
    </dialog>
</body>
</html>
