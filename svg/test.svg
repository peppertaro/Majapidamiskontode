<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 77 66.5">
  <style>
    .p { transform-box: fill-box; }
    .loading .p { animation: drop 2s infinite; }
    .p-1 { animation-delay: 0s; }
    .p-2 { animation-delay: 1s; }
    @keyframes drop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(var(--dy)); }
    }
  </style>
  <g id="logo">
    <path class="p p-2" style="--dy:-28px" d="M8.5,48.5 38.5,66.5 68.5,48.5 38.5,30.5Z" fill="#93c5fd" opacity="0.6"/>
    <path class="p p-1" style="--dy:-12px" d="M8.5,36.5 38.5,54.5 68.5,36.5 38.5,18.5Z" fill="#3b82f6" opacity="0.85"/>
    <path id="m" d="M8.5,20.5 13.5,24.6v27l-5-3ZM8.5,20.5 38.5,38.5v5L8.5,25.5Z" fill="#1e40af"/>
    <use href="#m" transform="translate(77,0) scale(-1,1)" fill="#3b82f6"/>
    <path class="p" d="M8.5,20.5 38.5,38.5 38.5,2.5 8.5,20.5Z" fill="#2563eb"/>
    <path class="p" d="M68.5,20.5 38.5,38.5 38.5,2.5 68.5,20.5Z" fill="#1d4ed8"/>
    <path d="M3,26.5 38.5,3 74.5,26.5" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  </g>
  <script>
    window.loading = s => document.getElementById('logo').classList.toggle('loading',s);
  </script>
</svg>