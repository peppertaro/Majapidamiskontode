<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
  <style>
    .p { transform-box: fill-box; }
    .run .p { animation: drop 1.8s infinite; }
    .p-1 { animation-delay: 0s; }
    .p-2 { animation-delay: 0.15s; }

    @keyframes drop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(var(--dy)); }
    }
  </style>

  <g id="l">
    <path class="p p-1" style="--dy:40px" d="M8.5,48.5 38.5,66.5 68.5,48.5 38.5,30.5Z" fill="#3498db" />
    <path class="p p-2" style="--dy:20px" d="M8.5,48.5 38.5,66.5 68.5,48.5 38.5,30.5Z" fill="#2ecc71" />
    <path class="p" d="M8.5,48.5 38.5,66.5 68.5,48.5 38.5,30.5Z" fill="#e74c3c" />
  </g>

  <script>
    window.loading = () => document.getElementById('l').classList.toggle('run');
  </script>
</svg>
